name: Laravel CI

on:
  push:
    branches:
      - main
      - nouveau
  pull_request:

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 29122003
          POSTGRES_DB: wave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pgsql, pdo_pgsql
        coverage: none

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --no-interaction

    - name: Copy .env files
      run: |
        cp .env.example .env
        cp .env.example .env.testing

    - name: Configure .env.testing
      run: |
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env.testing
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
        sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=wave_test/' .env.testing
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=29122003/' .env.testing

    - name: Generate application key
      run: php artisan key:generate

    - name: Run migrations
      run: php artisan migrate --env=testing --no-interaction

    - name: Run tests
      run: php artisan test --env=testing
